<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertidor iLO</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #12161a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1c232b;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            width: 450px;
            margin-bottom: 20px;
        }
        h2 { color: #52a3ff; margin-bottom: 20px; font-size: 1.4em; }
        input {
            width: 80%;
            padding: 10px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 5px;
            color: white;
            font-size: 1.2em;
            text-align: center;
            text-transform: uppercase;
            margin-bottom: 15px;
        }
        .btn-buscar {
            width: 85%;
            padding: 12px;
            background-color: transparent;
            border: 2px solid #52a3ff;
            color: white;
            font-weight: bold;
            font-size: 1.1em;
            border-radius: 5px;
            cursor: pointer;
        }
        .status-msg { color: #8b949e; margin-top: 15px; font-size: 0.9em; }
        .box-multi {
            background-color: #1c232b;
            width: 450px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .title-multi { font-size: 0.9em; color: #8b949e; text-align: left; margin-bottom: 10px; }
        .lista-resultados {
            background-color: #0d1117;
            border: 1px solid #30363d;
            min-height: 100px;
            max-height: 200px;
            overflow-y: auto;
            border-radius: 5px;
            padding: 10px;
            font-family: monospace;
            font-size: 0.85em;
            text-align: left;
            margin-bottom: 15px;
        }
        .item-res { padding: 5px 0; border-bottom: 1px solid #21262d; color: #8b949e; }
        .item-error { color: #ff6b6b; }
        .buttons-group { display: flex; gap: 10px; }
        .btn-action { flex: 1; padding: 10px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; color: white; }
        .btn-blue { background-color: #52a3ff; }
        .btn-green { background-color: #2ea44f; }
        .btn-white { background-color: #ffffff; color: black; }
    </style>
</head>
<body>

    <!-- Elemento Puente invisible indispensable para Tampermonkey -->
    <div id="puente-datos-tm" style="display: none;" data-buscar-sn="" data-sn-actual="" data-resultado=""></div>

    <div class="container">
        <h2>Convertidor por Serial / MAC</h2>
        <input type="text" id="input-serial" placeholder="INPUT SERIAL / MAC">
        <button class="btn-buscar" id="btn-ejecutar">Buscando...</button>
        <div class="status-msg" id="mensaje-estado">Buscando informacion del servidor, por favor espera...</div>
    </div>

    <div class="box-multi">
        <div class="title-multi">:: Procesar Múltiples IPv6</div>
        <div class="lista-resultados" id="contenedor-lista">
            <!-- Los resultados aparecerán aquí -->
        </div>
        <div class="buttons-group">
            <button class="btn-action btn-blue">Abrir Todas</button>
            <button class="btn-action btn-green">Excel</button>
            <button class="btn-action btn-white" id="btn-limpiar">Limpiar</button>
        </div>
    </div>

    <script>
        const puente = document.getElementById('puente-datos-tm');
        const inputSerial = document.getElementById('input-serial');
        const btnEjecutar = document.getElementById('btn-ejecutar');
        const mensajeEstado = document.getElementById('mensaje-estado');
        const contenedorLista = document.getElementById('contenedor-lista');
        const btnLimpiar = document.getElementById('btn-limpiar');

        let buscando = false;

        function iniciarBusqueda() {
            const sn = inputSerial.value.trim().toUpperCase();
            if (sn === "" || buscando) return;

            buscando = true;
            btnEjecutar.innerText = "Buscando...";
            mensajeEstado.innerText = "Buscando informacion del servidor, por favor espera...";

            // Le pedimos a Tampermonkey que busque
            puente.setAttribute('data-buscar-sn', sn);
        }

        // Escuchar cuando Tampermonkey regrese una respuesta
        const observador = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                if (mutation.attributeName === 'data-resultado') {
                    const resultado = puente.getAttribute('data-resultado');
                    if (!resultado) return;

                    const snEvaluado = puente.getAttribute('data-sn-actual') || inputSerial.value;

                    // Clonamos el renglón para la lista inferior
                    const nuevoRenglon = document.createElement('div');
                    nuevoRenglon.className = "item-res";

                    if (resultado === "ERROR") {
                        // Si el servidor de la empresa no lo encontró
                        nuevoRenglon.innerHTML = `SN: ${snEvaluado} | <span class="item-error">[NO ENCONTRADO]</span> | Pwd: N/A`;
                        mensajeEstado.innerText = "Búsqueda finalizada: No se encontraron registros.";
                    } else {
                        // Si sí encontró datos (Formato: mac|ip|macSha|ipv6|pwd)
                        const datos = resultado.split('|');
                        nuevoRenglon.innerHTML = `SN: ${snEvaluado} | MAC: ${datos[0]} | Pwd: ${datos[4]}`;
                        mensajeEstado.innerText = "¡Información del servidor obtenida con éxito!";
                    }

                    contenedorLista.appendChild(nuevoRenglon);
                    
                    // Resetear el botón de arriba para poder volver a buscar
                    btnEjecutar.innerText = "Buscar";
                    buscando = false;

                    // Limpiar el puente para la siguiente consulta
                    puente.setAttribute('data-resultado', '');
                    puente.setAttribute('data-sn-actual', '');
                }
            });
        });

        observador.observe(puente, { attributes: true });

        // Eventos de los botones
        btnEjecutar.addEventListener('click', () => {
            if (!buscando) {
                iniciarBusqueda();
            }
        });

        inputSerial.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !buscando) {
                iniciarBusqueda();
            }
        });

        btnLimpiar.addEventListener('click', () => {
            contenedorLista.innerHTML = "";
            mensajeEstado.innerText = "Esperando nueva consulta...";
            btnEjecutar.innerText = "Buscar";
            buscando = false;
        });

        // Ejecutar búsqueda automática inicial si ya tiene un valor puesto
        window.addEventListener('load', () => {
            // Inicializar el botón en modo "Buscar" si no está corriendo nada
            setTimeout(() => {
                if (puente.getAttribute('data-buscar-sn') === "") {
                    btnEjecutar.innerText = "Buscar";
                    mensajeEstado.innerText = "Introduce un Serial y presiona Buscar.";
                }
            }, 600);
        });
    </script>
</body>
</html>
